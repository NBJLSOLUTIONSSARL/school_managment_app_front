name: Frontend & Landing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend SPA (React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint & Linters
        run: npm run lint

      - name: Run Vitest Suite
        run: npm run test

      - name: Build SPA
        run: npm run build

  landing:
    name: Landing Page (Next.js 15)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install landing dependencies
        working-directory: landing-page
        run: npm ci

      - name: Build Next.js Landing
        working-directory: landing-page
        run: npm run build

  docker-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
