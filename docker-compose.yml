services:
  mysql:
    image: mysql:8.0.36
    container_name: school_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-schooldb}
      MYSQL_USER: ${MYSQL_USER:-school_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-school_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - school_network

  redis:
    image: redis:7.0.15-alpine
    container_name: school_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - school_network

  backend:
    build:
      context: ../../../JAVA SPRING BOOT/school_managment_app
      dockerfile: Dockerfile
    container_name: school_app_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-schooldb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-school_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-school_pass}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-c2Nob29sLW1hbmFnZW1lbnQtYXBwLXNlY3JldC1rZXktZm9yLXRlc3RpbmctYW5kLWRldmVsb3BtZW50LTIwMjY=}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-document-storage-secure-hmac-sha256-key-2026-very-secure}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@edutrack.school}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - school_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_app_frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - school_network

  landing:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    container_name: school_app_landing
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - school_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: school_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - school_network

volumes:
  mysql_data:
  redis_data:
  backend_uploads:

networks:
  school_network:
    driver: bridge
